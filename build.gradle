import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.15.0'
}

group = 'com.classpilot'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

def springDocVersion = '2.8.13'
def mysqlVersion = '8.4.0'
def flywayVersion = '11.13.0'

ext {
    springBootVersion = '3.5.6'
    javaVersion = '25'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    implementation project(':classpilot-framework')

    implementation "com.mysql:mysql-connector-j:${mysqlVersion}"
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-mysql:${flywayVersion}"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.mockito:mockito-core'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    testLogging {
        events TestLogEvent.PASSED,
                TestLogEvent.FAILED,
                TestLogEvent.SKIPPED

        exceptionFormat = TestExceptionFormat.FULL
    }
}

openApiGenerate {
    generatorName = 'spring'
    inputSpec = layout.projectDirectory
            .file('src/main/openapi/classpilot-openapi.yaml')
            .asFile.absolutePath
    outputDir = layout.buildDirectory
            .dir('generated/openapi')
            .get()
            .asFile.absolutePath

    apiPackage = 'com.classpilot.api'
    modelPackage = 'com.classpilot.model'

    configOptions = [
            interfaceOnly             : 'true',
            useSpringBoot3            : 'true',
            useTags                   : 'true',
            openApiNullable           : 'false',
            generateSupportingFiles   : 'false',
            skipDefaultInterface      : 'true'
    ]
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
}

sourceSets {
    main {
        java {
            srcDir "${layout.buildDirectory.get()}/generated/openapi/src/main/java"
        }
    }
}

tasks.register('printToolchain') {
    doLast {
        println "Java toolchain: ${java.toolchain.languageVersion.get()}"
        println "Spring Boot: ${project.ext.springBootVersion}"
    }
}
