services:
  mysql:
    image: mysql:8.4
    container_name: classpilot-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-classpilot}
      MYSQL_USER: ${DB_USERNAME:-classpilot}
      MYSQL_PASSWORD: ${DB_PASSWORD:-classpilot}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
